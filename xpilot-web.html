<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>XPilot - Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: Arial, sans-serif;
            background: #0c0c18;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            background: #0c0c18;
            border: 2px solid #444;
            touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #c8c8c8;
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
        #deadMsg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #dcdcdc;
            font-size: 18px;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 5px;
            z-index: 200;
            pointer-events: none;
            display: none;
        }

        /* Mobile controls */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            gap: 10px;
            pointer-events: none;
        }

        /* Left joystick area */
        .joystick-area {
            width: 100px;
            height: 100px;
            background: rgba(100,100,150,0.3);
            border: 2px solid #666;
            border-radius: 50%;
            pointer-events: auto;
            position: relative;
        }
        .joystick-area canvas {
            border-radius: 50%;
        }

        /* Right buttons area */
        .buttons-area {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
        }
        .control-btn {
            width: 90px;
            height: 40px;
            background: rgba(100,150,100,0.3);
            border: 2px solid #666;
            color: #aaa;
            font-size: 12px;
            border-radius: 5px;
            touch-action: none;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn.active {
            background: rgba(100,200,100,0.5);
            color: #fff;
        }
        .control-btn.shoot {
            flex: 1;
            width: 90px;
            height: auto;
            min-height: 50px;
        }

        @media (max-width: 480px) {
            #info { font-size: 12px; }
            .control-btn { width: 70px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="info">
            <div>Score: <span id="score">0</span></div>
        </div>
        <div id="deadMsg">
            You Died<br>Press R to restart
        </div>
        <div id="controls">
            <div class="joystick-area" id="joystick"></div>
            <div class="buttons-area">
                <button class="control-btn" id="thrustBtn">Thrust</button>
                <button class="control-btn shoot" id="shootBtn">SHOOT</button>
                <button class="control-btn" id="restartBtn" style="display:none;">Restart</button>
            </div>
        </div>
    </div>

    <script>
        const WIDTH = 800;
        const HEIGHT = 600;
        const FPS = 60;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');
        
        // Set canvas size
        function setCanvasSize() {
            const rect = gameContainer.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        // Game state
        let player = {
            x: WIDTH / 2,
            y: HEIGHT / 2,
            vx: 0,
            vy: 0,
            angle: 0,
            thrust: 0,
            dead: false
        };

        let bullets = [];
        let enemies = [];
        let score = 0;
        let shootCool = 0;
        let keys = {};
        let touch = { left: 0, right: 0, thrust: false, shoot: false };

        // Initialize enemies
        function initEnemies() {
            enemies = [];
            for (let i = 0; i < 6; i++) {
                enemies.push(createEnemy());
            }
        }

        function createEnemy() {
            const x = Math.random() * WIDTH;
            const y = Math.random() * HEIGHT;
            const angle = Math.random() * Math.PI * 2;
            const speed = 20 + Math.random() * 60;
            return {
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                r: 10 + Math.floor(Math.random() * 16)
            };
        }

        // Joystick input
        const joystickEl = document.getElementById('joystick');
        let joystickTouch = null;
        
        joystickEl.addEventListener('touchstart', (e) => {
            joystickTouch = e.touches[0];
            updateJoystick(e.touches[0]);
        });
        joystickEl.addEventListener('touchmove', (e) => {
            if (joystickTouch) updateJoystick(e.touches[0]);
        });
        joystickEl.addEventListener('touchend', () => {
            joystickTouch = null;
            touch.left = 0;
            touch.right = 0;
        });

        function updateJoystick(t) {
            const rect = joystickEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = t.clientX - cx;
            const dy = t.clientY - cy;
            const dist = Math.hypot(dx, dy);
            const maxDist = rect.width / 2;
            
            if (dist > maxDist * 0.3) {
                const angle = Math.atan2(dy, dx);
                touch.left = Math.cos(angle);
                touch.right = Math.sin(angle);
            }
        }

        // Button inputs
        document.getElementById('thrustBtn').addEventListener('touchstart', () => {
            touch.thrust = true;
        });
        document.getElementById('thrustBtn').addEventListener('touchend', () => {
            touch.thrust = false;
        });

        document.getElementById('shootBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            touch.shoot = true;
        });
        document.getElementById('shootBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            touch.shoot = false;
        });

        document.getElementById('restartBtn').addEventListener('touchstart', () => {
            if (player.dead) {
                player.dead = false;
                bullets = [];
                initEnemies();
                score = 0;
                document.getElementById('restartBtn').style.display = 'none';
            }
        });

        // Keyboard (for desktop testing)
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'r' || e.key === 'R') {
                if (player.dead) {
                    player.dead = false;
                    bullets = [];
                    initEnemies();
                    score = 0;
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Update loop
        function update(dt) {
            // Input
            player.thrust = 0;
            if (keys['ArrowUp'] || keys['w'] || keys['W'] || touch.thrust) player.thrust = 200;
            if (keys['ArrowLeft'] || keys['a'] || keys['A'] || touch.left < -0.5) player.angle -= 3 * dt;
            if (keys['ArrowRight'] || keys['d'] || keys['D'] || touch.left > 0.5) player.angle += 3 * dt;

            // Shooting
            shootCool -= dt;
            if ((keys[' '] || keys['Space'] || touch.shoot) && shootCool <= 0 && !player.dead) {
                shootCool = 0.15;
                const speed = 400;
                const bx = player.x + Math.cos(player.angle) * 16;
                const by = player.y + Math.sin(player.angle) * 16;
                const bvx = player.vx + Math.cos(player.angle) * speed;
                const bvy = player.vy + Math.sin(player.angle) * speed;
                bullets.push({ x: bx, y: by, vx: bvx, vy: bvy, life: 2.0 });
            }

            // Player physics
            if (!player.dead) {
                player.vx += Math.cos(player.angle) * player.thrust * dt;
                player.vy += Math.sin(player.angle) * player.thrust * dt;
                player.vx *= 0.995;
                player.vy *= 0.995;
                player.x += player.vx * dt;
                player.y += player.vy * dt;
                player.x = ((player.x % WIDTH) + WIDTH) % WIDTH;
                player.y = ((player.y % HEIGHT) + HEIGHT) % HEIGHT;
            }

            // Update bullets
            bullets = bullets.filter(b => {
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.life -= dt;
                b.x = ((b.x % WIDTH) + WIDTH) % WIDTH;
                b.y = ((b.y % HEIGHT) + HEIGHT) % HEIGHT;
                return b.life > 0;
            });

            // Update enemies
            enemies.forEach(e => {
                e.x += e.vx * dt;
                e.y += e.vy * dt;
                e.x = ((e.x % WIDTH) + WIDTH) % WIDTH;
                e.y = ((e.y % HEIGHT) + HEIGHT) % HEIGHT;
            });

            // Collisions
            if (!player.dead) {
                for (let e of enemies) {
                    const dist = Math.hypot(player.x - e.x, player.y - e.y);
                    if (dist < e.r + 8) {
                        player.dead = true;
                        document.getElementById('restartBtn').style.display = 'block';
                        break;
                    }
                }
            }

            // Bullet-enemy collisions
            for (let b of bullets) {
                for (let i = 0; i < enemies.length; i++) {
                    const e = enemies[i];
                    const dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < e.r) {
                        enemies.splice(i, 1);
                        bullets = bullets.filter(x => x !== b);
                        score += 10;
                        enemies.push(createEnemy());
                        break;
                    }
                }
            }
        }

        // Draw
        function draw() {
            const scaleX = canvas.width / WIDTH;
            const scaleY = canvas.height / HEIGHT;

            ctx.fillStyle = '#0c0c18';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Helper to draw scaled
            const drawShip = (x, y, angle, scale, color) => {
                ctx.fillStyle = color;
                const heading = [Math.cos(angle), Math.sin(angle)];
                const right = [Math.cos(angle + 2.5), Math.sin(angle + 2.5)];
                const left = [Math.cos(angle - 2.5), Math.sin(angle - 2.5)];
                const pts = [
                    [(x + heading[0] * scale) * scaleX, (y + heading[1] * scale) * scaleY],
                    [(x + right[0] * scale * 0.7) * scaleX, (y + right[1] * scale * 0.7) * scaleY],
                    [(x + left[0] * scale * 0.7) * scaleX, (y + left[1] * scale * 0.7) * scaleY]
                ];
                ctx.beginPath();
                ctx.moveTo(pts[0][0], pts[0][1]);
                ctx.lineTo(pts[1][0], pts[1][1]);
                ctx.lineTo(pts[2][0], pts[2][1]);
                ctx.closePath();
                ctx.fill();
            };

            // Draw enemies
            ctx.fillStyle = '#c87878';
            enemies.forEach(e => {
                ctx.beginPath();
                ctx.arc(e.x * scaleX, e.y * scaleY, e.r * scaleX, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw bullets
            ctx.fillStyle = '#fff078';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x * scaleX, b.y * scaleY, 3 * scaleX, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw player
            if (!player.dead) {
                drawShip(player.x, player.y, player.angle, 12, '#b4c8ff');
            }

            // Update HUD
            document.getElementById('score').textContent = score;
            document.getElementById('deadMsg').style.display = player.dead ? 'block' : 'none';
        }

        // Game loop
        let lastTime = Date.now();
        function gameLoop() {
            const now = Date.now();
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start
        initEnemies();
        gameLoop();
    </script>
</body>
</html>
