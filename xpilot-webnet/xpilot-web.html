<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>XPilot - Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: Arial, sans-serif;
            background: #0c0c18;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 4/3;
            background: #0c0c18;
            border: 2px solid #444;
            touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #info {
            position: absolute;
            top: 10px; right: 10px;
            color: #c8c8c8;
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            text-align: right;
            line-height: 1.6;
        }
        #deadMsg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #dcdcdc; font-size: 18px; text-align: center;
            background: rgba(0,0,0,0.75);
            padding: 20px; border-radius: 5px;
            z-index: 200; pointer-events: none; display: none;
        }
        #minimapWrap {
            position: absolute;
            top: 10px; left: 10px;
            z-index: 100; pointer-events: none;
            background: rgba(0,0,0,0.5);
            border: 1px solid #555;
            border-radius: 4px;
            padding: 3px;
        }
        #minimap { display: block; border-radius: 2px; }
        #minimapLabel {
            font-family: monospace; font-size: 10px;
            color: #888; text-align: center; margin-top: 2px;
        }
        #controls {
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 120px;
            display: flex; justify-content: space-between;
            padding: 10px; gap: 10px; pointer-events: none;
        }
        .joystick-area {
            width: 100px; height: 100px;
            background: rgba(100,100,150,0.3);
            border: 2px solid #666; border-radius: 50%;
            pointer-events: auto;
        }
        .buttons-area { display: flex; flex-direction: column; gap: 5px; pointer-events: auto; }
        .control-btn {
            width: 90px; height: 40px;
            background: rgba(100,150,100,0.3);
            border: 2px solid #666; color: #aaa;
            font-size: 12px; border-radius: 5px;
            touch-action: none; user-select: none;
            display: flex; align-items: center; justify-content: center;
        }
        .control-btn.shoot { flex: 1; width: 90px; height: auto; min-height: 50px; }
        @media (max-width: 480px) {
            #info { font-size: 12px; }
            .control-btn { width: 70px; font-size: 11px; }
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="minimapWrap">
        <canvas id="minimap" width="150" height="113"></canvas>
        <div id="minimapLabel">minimap</div>
    </div>

    <div id="info">
        Score: <span id="score">0</span><br>
        <span style="color:#c87878">● circle</span> 10pts&nbsp;
        <span style="color:#f0a050">▲ shooter</span> 20pts&nbsp;
        <span style="color:#b07fe0">■ tank</span> 50pts<br>
        <span id="connStatus" style="color:#888">Offline (single player)</span><span id="roleTag" style="font-size:11px"></span>
        <span id="playerCount"></span>
    </div>

    <div id="deadMsg">You Died<br>Press R to restart</div>

    <div id="controls">
        <div class="joystick-area" id="joystick"></div>
        <div class="buttons-area">
            <button class="control-btn" id="thrustBtn">Thrust</button>
            <button class="control-btn shoot" id="shootBtn">SHOOT</button>
            <button class="control-btn" id="restartBtn" style="display:none;">Restart</button>
        </div>
    </div>
</div>

<script>
    const WORLD_W = 3200, WORLD_H = 2400;
    const VIEW_W  = 800,  VIEW_H  = 600;

    // Entity counts per type
    const N_CIRCLES   = 14;  // dumb wanderers,  10 pts
    const N_SHOOTERS  = 8;   // orange triangles, 20 pts, fire back slowly
    const N_TANKS     = 5;   // purple squares,   50 pts, slow & chunky

    // ── Multiplayer state ────────────────────────────────────────────────
    const MY_ID = 'p_' + Math.random().toString(36).slice(2, 10);
    let myName = 'Pilot-' + MY_ID.slice(2, 6);
    let remotePlayers = {};   // id -> { x, y, angle, dead, name, lastUpdate }
    let remoteBullets = [];   // bullets fired by other players
    let ws = null;
    let netState = 'offline'; // offline | connecting | connected | error
    const STATE_SEND_HZ = 15;
    let stateSendAccum = 0;
    const REMOTE_TIMEOUT = 8.0;

    // ── Host election ─────────────────────────────────────────────────────
    // The client with the lexicographically smallest ID is the host.
    // The host runs the authoritative entity simulation and broadcasts
    // entity state to all other clients at ENTITY_SEND_HZ.
    let allKnownIds = new Set([MY_ID]);
    let isHost = true;   // true until another player joins with a lower ID

    function reelectHost() {
        const minId = [...allKnownIds].sort()[0];
        isHost = (minId === MY_ID);
    }

    const ENTITY_SEND_HZ = 12;    // entity state broadcasts per second
    let entitySendAccum = 0;

    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    const gc     = document.getElementById('gameContainer');
    const mm     = document.getElementById('minimap');
    const mctx   = mm.getContext('2d');

    function resize() {
        const r = gc.getBoundingClientRect();
        canvas.width = r.width; canvas.height = r.height;
    }
    resize();
    window.addEventListener('resize', resize);

    function wrapDelta(a, b, size) {
        let d = ((b - a) % size + size) % size;
        if (d > size / 2) d -= size;
        return d;
    }

    // ── Entity factories ──────────────────────────────────────────────────

    // Each entity carries a `gen` (generation) counter that increments every
    // time the entity is replaced (killed + respawned).  Hit messages include
    // the sender's `gen` value; the host rejects hits whose gen doesn't match
    // the current entity at that index, preventing stale hits from damaging
    // freshly-spawned enemies.
    let _nextGen = 1;
    function nextGen() { return _nextGen++; }

    // HP per type: circles = 1 (one-shot), shooters = 2, tanks = 5
    function mkCircle() {
        const ang = Math.random() * Math.PI * 2;
        return {
            kind: 'circle', gen: nextGen(),
            x: Math.random() * WORLD_W, y: Math.random() * WORLD_H,
            vx: Math.cos(ang) * (20 + Math.random() * 60),
            vy: Math.sin(ang) * (20 + Math.random() * 60),
            r: 10 + Math.floor(Math.random() * 16),
            pts: 10, hp: 1, maxHp: 1, hitFlash: 0,
        };
    }

    function mkShooter() {
        const ang = Math.random() * Math.PI * 2;
        return {
            kind: 'shooter', gen: nextGen(),
            x: Math.random() * WORLD_W, y: Math.random() * WORLD_H,
            vx: Math.cos(ang) * (15 + Math.random() * 35),
            vy: Math.sin(ang) * (15 + Math.random() * 35),
            r: 13, pts: 20, angle: ang,
            fireCool: 2 + Math.random() * 2,
            hp: 2, maxHp: 2, hitFlash: 0,
        };
    }

    function mkTank() {
        const ang = Math.random() * Math.PI * 2;
        return {
            kind: 'tank', gen: nextGen(),
            x: Math.random() * WORLD_W, y: Math.random() * WORLD_H,
            vx: Math.cos(ang) * (8 + Math.random() * 12),
            vy: Math.sin(ang) * (8 + Math.random() * 12),
            r: 22 + Math.floor(Math.random() * 10),
            pts: 50, hp: 5, maxHp: 5, hitFlash: 0,
        };
    }

    // ── State ─────────────────────────────────────────────────────────────

    let player, playerBullets, enemyBullets, entities, score, shootCool;
    let keys = {}, touch = { left: 0, right: 0, thrust: false, shoot: false };

    function initGame() {
        player = { x: WORLD_W/2, y: WORLD_H/2, vx:0, vy:0, angle:0, thrust:0, dead:false };
        playerBullets = [];
        enemyBullets  = [];
        score = 0;
        shootCool = 0;
        entities = [
            ...Array.from({length: N_CIRCLES},  mkCircle),
            ...Array.from({length: N_SHOOTERS}, mkShooter),
            ...Array.from({length: N_TANKS},    mkTank),
        ];
    }

    function restart() {
        initGame();
        document.getElementById('restartBtn').style.display = 'none';
    }

    // ── Networking ────────────────────────────────────────────────────────

    function setConnStatus(state, text) {
        netState = state;
        const el = document.getElementById('connStatus');
        el.textContent = text;
        el.style.color = state === 'connected'  ? '#7fdc8f'
                        : state === 'connecting' ? '#e0c060'
                        : state === 'error'      ? '#e07070'
                        :                           '#888';
    }

    function wsUrlGuess() {
        // Default relay port for ws_server.py is 8765. Assume it runs on
        // the same host that served this page (works for both plain HTTP
        // and HTTPS — wss:// is used automatically when the page is
        // loaded over https:).
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = location.hostname || 'localhost';
        return `${proto}//${host}:8765`;
    }

    function connectMultiplayer(url) {
        if (ws) { try { ws.close(); } catch (e) {} }
        setConnStatus('connecting', 'Connecting...');
        try {
            ws = new WebSocket(url);
        } catch (e) {
            setConnStatus('error', 'Connection failed');
            return;
        }

        ws.onopen = () => {
            setConnStatus('connected', 'Connected');
            ws.send(JSON.stringify({ type: 'join', id: MY_ID, name: myName }));
        };

        ws.onmessage = (ev) => {
            let msg;
            try { msg = JSON.parse(ev.data); } catch (e) { return; }
            handleNetMessage(msg);
        };

        ws.onerror = () => { setConnStatus('error', 'Connection error'); };

        ws.onclose = () => {
            if (netState !== 'error') setConnStatus('offline', 'Offline (single player)');
            // Immediately restore host authority so shooter AI and entity
            // simulation resume without waiting for the stale-prune cycle.
            for (const id of [...allKnownIds]) {
                if (id !== MY_ID) allKnownIds.delete(id);
            }
            for (const id in remotePlayers) delete remotePlayers[id];
            reelectHost();
            updatePlayerCount();
        };
    }

    function handleNetMessage(msg) {
        if (!msg || !msg.type) return;

        if (msg.type === 'roster') {
            (msg.players || []).forEach(p => {
                if (p.id === MY_ID) return;
                allKnownIds.add(p.id);
                upsertRemote(p.id, p.name, p.state);
            });
            reelectHost();
            updatePlayerCount();
            return;
        }

        if (msg.type === 'player_joined') {
            if (msg.id === MY_ID) return;
            allKnownIds.add(msg.id);
            reelectHost();
            if (!remotePlayers[msg.id]) {
                remotePlayers[msg.id] = {
                    x: WORLD_W / 2, y: WORLD_H / 2, angle: 0,
                    dead: false, name: msg.name || msg.id.slice(0, 6),
                    lastUpdate: performance.now() / 1000,
                };
            }
            updatePlayerCount();
            return;
        }

        if (msg.type === 'player_left') {
            allKnownIds.delete(msg.id);
            reelectHost();
            delete remotePlayers[msg.id];
            updatePlayerCount();
            return;
        }

        if (msg.type === 'state') {
            if (msg.id === MY_ID) return;
            if (!allKnownIds.has(msg.id)) {
                allKnownIds.add(msg.id);
                reelectHost();   // a previously-unknown peer appeared; re-check who is host
            }
            upsertRemote(msg.id, msg.name, msg);
            return;
        }

        if (msg.type === 'shoot') {
            if (msg.id === MY_ID) return;
            remoteBullets.push({ x: msg.x, y: msg.y, vx: msg.vx, vy: msg.vy, life: 2.2 });
            return;
        }

        // ── Entity sync messages ──────────────────────────────────────────
        if (msg.type === 'enemies') {
            // Only non-hosts apply host's entity state
            if (msg.id === MY_ID || isHost) return;
            applyHostEntities(msg.entities || []);
            return;
        }

        if (msg.type === 'hit') {
            // Only the host processes incoming hit reports from non-hosts
            if (!isHost || msg.id === MY_ID) return;
            const idx = msg.idx;
            if (idx < 0 || idx >= entities.length) return;
            const e = entities[idx];
            // Reject stale hits: if gen doesn't match, this hit targeted an
            // entity that has already been replaced (respawned); discard it.
            if (msg.gen !== undefined && e.gen !== msg.gen) return;
            e.hp = Math.max(0, e.hp - 1);
            e.hitFlash = 0.18;
            if (e.hp <= 0) {
                const replacement = e.kind === 'circle'  ? mkCircle()
                                  : e.kind === 'shooter' ? mkShooter()
                                  :                        mkTank();
                entities.splice(idx, 1, replacement);
            }
            return;
        }
    }

    function upsertRemote(id, name, state) {
        if (!state) return;
        const existed = !!remotePlayers[id];
        remotePlayers[id] = {
            x: state.x, y: state.y, angle: state.angle || 0,
            dead: !!state.dead,
            name: name || (remotePlayers[id] && remotePlayers[id].name) || id.slice(0, 6),
            lastUpdate: performance.now() / 1000,
        };
        if (!existed) updatePlayerCount();
    }

    function updatePlayerCount() {
        const n = Object.keys(remotePlayers).length;
        document.getElementById('playerCount').textContent =
            n > 0 ? ` · ${n} other pilot${n === 1 ? '' : 's'} online` : '';
    }

    function pruneStaleRemotes() {
        const now = performance.now() / 1000;
        let changed = false;
        for (const id in remotePlayers) {
            if (now - remotePlayers[id].lastUpdate > REMOTE_TIMEOUT) {
                allKnownIds.delete(id);
                delete remotePlayers[id];
                changed = true;
            }
        }
        if (changed) { reelectHost(); updatePlayerCount(); }
    }

    // ── Entity sync helpers ───────────────────────────────────────────────

    /** Serialize entity array into a compact JSON-safe form for network send. */
    function serializeEntities() {
        return entities.map(e => {
            const d = {
                kind: e.kind,
                gen:  e.gen,   // generation counter — used to validate hit messages
                x: Math.round(e.x * 10) / 10,
                y: Math.round(e.y * 10) / 10,
                vx: Math.round(e.vx * 10) / 10,
                vy: Math.round(e.vy * 10) / 10,
                r: e.r,
                hp: e.hp,
                maxHp: e.maxHp,
                pts: e.pts,
            };
            if (e.kind === 'shooter') {
                d.angle    = Math.round(e.angle * 1000) / 1000;
                d.fireCool = Math.round(e.fireCool * 100) / 100;
            }
            return d;
        });
    }

    /**
     * Apply entity state received from the host.
     * - Replaces entities whose kind changed (respawned enemies).
     * - Updates position/velocity/hp for entities of the same kind.
     * - Preserves local hitFlash so visual feedback isn't clobbered.
     */
    function applyHostEntities(hostEntities) {
        if (!Array.isArray(hostEntities) || hostEntities.length === 0) return;

        // Guard: skip malformed entries that lack the minimum required fields
        const VALID_KINDS = new Set(['circle', 'shooter', 'tank']);
        const valid = hostEntities.every(he =>
            he && VALID_KINDS.has(he.kind) && typeof he.gen === 'number' &&
            typeof he.x === 'number' && typeof he.y === 'number'
        );
        if (!valid) return;

        // If the list length changed (shouldn't happen but be safe), rebuild
        if (hostEntities.length !== entities.length) {
            entities = hostEntities.map(he => {
                const e = he.kind === 'circle'  ? mkCircle()
                        : he.kind === 'shooter' ? mkShooter()
                        :                         mkTank();
                Object.assign(e, he);
                e.hitFlash = 0;
                return e;
            });
            return;
        }

        for (let i = 0; i < entities.length; i++) {
            const e  = entities[i];
            const he = hostEntities[i];
            if (e.gen !== he.gen) {
                // Generation mismatch: entity was replaced on the host.
                // Build a fresh local copy from the host's data so factories
                // don't overwrite any fields that the host already set.
                const ne = he.kind === 'circle'  ? mkCircle()
                         : he.kind === 'shooter' ? mkShooter()
                         :                         mkTank();
                Object.assign(ne, he);          // host values win
                ne.gen      = he.gen;           // carry over host gen exactly
                ne.hitFlash = 0.15;             // brief flash so the swap is visible
                entities[i] = ne;
            } else {
                // Same entity: sync position, velocity, hp from host.
                e.x  = he.x;  e.y  = he.y;
                e.vx = he.vx; e.vy = he.vy;
                // Trigger hit flash when host records damage we didn't see locally
                if (he.hp < e.hp) { e.hp = he.hp; e.hitFlash = 0.15; }
                else               { e.hp = he.hp; }
                if (he.angle    !== undefined) e.angle    = he.angle;
                if (he.fireCool !== undefined) e.fireCool = he.fireCool;
            }
        }
    }

    /** Host: broadcast entity state to all peers. */
    function sendNetEntities(dt) {
        if (!ws || ws.readyState !== WebSocket.OPEN || !isHost) return;
        entitySendAccum += dt;
        if (entitySendAccum < 1 / ENTITY_SEND_HZ) return;
        entitySendAccum = 0;
        ws.send(JSON.stringify({ type: 'enemies', id: MY_ID, entities: serializeEntities() }));
    }

    /** Non-host: report a bullet hit on entity at index idx to the host.
     *  Includes the entity's gen so the host can reject stale hits. */
    function sendHit(idx) {
        if (!ws || ws.readyState !== WebSocket.OPEN || isHost) return;
        const gen = entities[idx] ? entities[idx].gen : -1;
        ws.send(JSON.stringify({ type: 'hit', id: MY_ID, idx, gen }));
    }

    function sendNetState(dt) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        stateSendAccum += dt;
        if (stateSendAccum < 1 / STATE_SEND_HZ) return;
        stateSendAccum = 0;
        ws.send(JSON.stringify({
            type: 'state', id: MY_ID, name: myName,
            x: player.x, y: player.y, angle: player.angle,
            vx: player.vx, vy: player.vy, dead: player.dead,
        }));
    }

    function sendNetShoot(b) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'shoot', id: MY_ID, x: b.x, y: b.y, vx: b.vx, vy: b.vy }));
    }

    // Try to connect automatically on load; falls back to single-player
    // seamlessly if no relay (ws_server.py) is reachable.
    connectMultiplayer(wsUrlGuess());

    window.addEventListener('beforeunload', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            try { ws.send(JSON.stringify({ type: 'leave', id: MY_ID })); } catch (e) {}
        }
    });

    // ── Input ─────────────────────────────────────────────────────────────

    const joystickEl = document.getElementById('joystick');
    joystickEl.addEventListener('touchstart', e => updateJoy(e.touches[0]));
    joystickEl.addEventListener('touchmove',  e => updateJoy(e.touches[0]));
    joystickEl.addEventListener('touchend',   () => { touch.left = touch.right = 0; });
    function updateJoy(t) {
        const r = joystickEl.getBoundingClientRect();
        const dx = t.clientX - (r.left + r.width/2);
        const dy = t.clientY - (r.top  + r.height/2);
        if (Math.hypot(dx, dy) > r.width * 0.15) {
            const a = Math.atan2(dy, dx);
            touch.left = Math.cos(a); touch.right = Math.sin(a);
        }
    }
    document.getElementById('thrustBtn').addEventListener('touchstart', () => { touch.thrust = true; });
    document.getElementById('thrustBtn').addEventListener('touchend',   () => { touch.thrust = false; });
    document.getElementById('shootBtn').addEventListener('touchstart', e => { e.preventDefault(); touch.shoot = true; });
    document.getElementById('shootBtn').addEventListener('touchend',   e => { e.preventDefault(); touch.shoot = false; });
    document.getElementById('restartBtn').addEventListener('touchstart', () => { if (player.dead) restart(); });
    window.addEventListener('keydown', e => {
        keys[e.key] = true;
        if ((e.key === 'r' || e.key === 'R') && player.dead) restart();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    // ── Update ────────────────────────────────────────────────────────────

    function wrapPos(obj) {
        obj.x = ((obj.x % WORLD_W) + WORLD_W) % WORLD_W;
        obj.y = ((obj.y % WORLD_H) + WORLD_H) % WORLD_H;
    }

    function update(dt) {
        // — Player input —
        player.thrust = 0;
        if (keys['ArrowUp']  || keys['w'] || keys['W'] || touch.thrust)       player.thrust = 200;
        if (keys['ArrowLeft']  || keys['a'] || keys['A'] || touch.left < -0.5) player.angle -= 3 * dt;
        if (keys['ArrowRight'] || keys['d'] || keys['D'] || touch.left >  0.5) player.angle += 3 * dt;

        shootCool -= dt;
        if ((keys[' '] || keys['Space'] || touch.shoot) && shootCool <= 0 && !player.dead) {
            shootCool = 0.15;
            const sp = 400;
            const b = {
                x: player.x + Math.cos(player.angle) * 16,
                y: player.y + Math.sin(player.angle) * 16,
                vx: player.vx + Math.cos(player.angle) * sp,
                vy: player.vy + Math.sin(player.angle) * sp,
                life: 2.2,
            };
            playerBullets.push(b);
            sendNetShoot(b);
        }

        // — Player physics —
        if (!player.dead) {
            player.vx += Math.cos(player.angle) * player.thrust * dt;
            player.vy += Math.sin(player.angle) * player.thrust * dt;
            player.vx *= 0.995; player.vy *= 0.995;
            player.x += player.vx * dt; player.y += player.vy * dt;
            wrapPos(player);
        }

        // — Player bullets —
        playerBullets = playerBullets.filter(b => {
            b.x += b.vx * dt; b.y += b.vy * dt;
            b.life -= dt; wrapPos(b);
            return b.life > 0;
        });

        // — Enemy bullets —
        enemyBullets = enemyBullets.filter(b => {
            b.x += b.vx * dt; b.y += b.vy * dt;
            b.life -= dt; wrapPos(b);
            return b.life > 0;
        });

        // — Entities —
        // canSee: true when the entity is within the player's visible viewport.
        // Uses wrap-aware deltas so entities near world edges work correctly.
        const canSee = (e) => {
            const dx = Math.abs(wrapDelta(e.x, player.x, WORLD_W));
            const dy = Math.abs(wrapDelta(e.y, player.y, WORLD_H));
            return dx <= VIEW_W / 2 && dy <= VIEW_H / 2;
        };

        for (const e of entities) {
            e.x += e.vx * dt; e.y += e.vy * dt;
            wrapPos(e);
            if (e.hitFlash > 0) e.hitFlash -= dt;

            if (e.kind === 'shooter') {
                const visible = canSee(e);

                // Only the host runs the shooter AI (aiming + firing).
                // Non-hosts just advance position/hitFlash (done above) so
                // the entity looks smooth between host syncs; they do NOT
                // spawn enemy bullets — those are purely cosmetic and each
                // client manages its own copy of enemyBullets for danger feedback.
                if (isHost) {
                    // Aim at the player when visible
                    if (visible) {
                        const tdx = wrapDelta(e.x, player.x, WORLD_W);
                        const tdy = wrapDelta(e.y, player.y, WORLD_H);
                        const targetAng = Math.atan2(tdy, tdx);
                        let da = targetAng - e.angle;
                        da = ((da + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
                        e.angle += Math.sign(da) * Math.min(Math.abs(da), 1.2 * dt);
                    }

                    // Cooldown always ticks; only fires when visible
                    e.fireCool -= dt;
                    if (e.fireCool <= 0 && visible && !player.dead) {
                        e.fireCool = 3 + Math.random() * 2;
                        const sp = 120;
                        enemyBullets.push({
                            x: e.x + Math.cos(e.angle) * (e.r + 4),
                            y: e.y + Math.sin(e.angle) * (e.r + 4),
                            vx: Math.cos(e.angle) * sp,
                            vy: Math.sin(e.angle) * sp,
                            life: 5,
                        });
                    }
                }
            }
        }

        // — Player vs enemy body collision —
        if (!player.dead) {
            for (const e of entities) {
                if (Math.hypot(player.x - e.x, player.y - e.y) < e.r + 8) {
                    player.dead = true;
                    document.getElementById('restartBtn').style.display = 'block';
                    break;
                }
            }
        }

        // — Player vs enemy bullets —
        if (!player.dead) {
            for (const b of enemyBullets) {
                if (Math.hypot(player.x - b.x, player.y - b.y) < 10) {
                    player.dead = true;
                    document.getElementById('restartBtn').style.display = 'block';
                    break;
                }
            }
        }

        // — Player bullets vs entities (hp-based damage, host-authoritative) ——
        //
        // HOST: runs the authoritative simulation — kills entities, respawns
        //   them, and the result is broadcast to all peers via sendNetEntities.
        //
        // NON-HOST: optimistically applies damage locally for instant feedback,
        //   then reports the hit to the host via sendHit().  The host's next
        //   entity sync (≤1/12 s later) will be the ground truth — if the host
        //   also processes the hit the entity will simply not be there in the
        //   next sync and the local replacement is already in place.
        for (const b of playerBullets) {
            for (let i = 0; i < entities.length; i++) {
                const e = entities[i];
                if (Math.hypot(b.x - e.x, b.y - e.y) < e.r) {
                    // Capture gen BEFORE any local kill/splice so the host
                    // message targets the correct entity generation.
                    const hitGen = e.gen;
                    e.hp -= 1;
                    e.hitFlash = 0.15;
                    playerBullets = playerBullets.filter(x => x !== b);

                    if (e.hp <= 0) {
                        score += e.pts;
                        const replacement = e.kind === 'circle'  ? mkCircle()
                                          : e.kind === 'shooter' ? mkShooter()
                                          :                        mkTank();
                        entities.splice(i, 1, replacement);
                        // Notify host AFTER local splice, using saved gen
                        // (sendHit uses entities[idx].gen which is now the replacement;
                        //  that's why we bypass it and send the captured hitGen directly)
                        if (!isHost && ws && ws.readyState === WebSocket.OPEN)
                            ws.send(JSON.stringify({ type: 'hit', id: MY_ID, idx: i, gen: hitGen }));
                    } else {
                        // Partial hit — entity still alive; sendHit helper is fine here
                        sendHit(i);
                    }
                    break;
                }
            }
        }

        // — Remote players' bullets (cosmetic only — don't damage entities
        //   or kill the local player; each client resolves its own combat) —
        remoteBullets = remoteBullets.filter(b => {
            b.x += b.vx * dt; b.y += b.vy * dt;
            b.life -= dt; wrapPos(b);
            return b.life > 0;
        });

        sendNetState(dt);
        sendNetEntities(dt);   // host-only; no-op for non-hosts
        pruneStaleRemotes();
    }

    // ── Draw ──────────────────────────────────────────────────────────────

    function draw() {
        const scx = canvas.width  / VIEW_W;
        const scy = canvas.height / VIEW_H;
        const camX = player.x, camY = player.y;

        function w2s(wx, wy) {
            return [
                (VIEW_W/2 + wrapDelta(camX, wx, WORLD_W)) * scx,
                (VIEW_H/2 + wrapDelta(camY, wy, WORLD_H)) * scy,
            ];
        }
        function onScreen(sx, sy, pad=60) {
            return sx > -pad && sx < canvas.width+pad && sy > -pad && sy < canvas.height+pad;
        }

        // Background
        ctx.fillStyle = '#0c0c18';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const gs = 400;
        for (let gx = Math.floor((camX-VIEW_W/2)/gs)*gs; gx <= camX+VIEW_W/2+gs; gx += gs) {
            const px = (VIEW_W/2 + wrapDelta(camX, gx, WORLD_W)) * scx;
            ctx.moveTo(px, 0); ctx.lineTo(px, canvas.height);
        }
        for (let gy = Math.floor((camY-VIEW_H/2)/gs)*gs; gy <= camY+VIEW_H/2+gs; gy += gs) {
            const py = (VIEW_H/2 + wrapDelta(camY, gy, WORLD_H)) * scy;
            ctx.moveTo(0, py); ctx.lineTo(canvas.width, py);
        }
        ctx.stroke();

        // ── Entities ──
        for (const e of entities) {
            const [ex, ey] = w2s(e.x, e.y);
            if (!onScreen(ex, ey)) continue;

            // hit-flash: interpolate toward white when recently hit
            const fl = Math.min(1, Math.max(0, e.hitFlash / 0.15));

            function flashColor(base) {
                // blend base colour toward white by flash amount
                const r = parseInt(base.slice(1,3),16);
                const g = parseInt(base.slice(3,5),16);
                const b = parseInt(base.slice(5,7),16);
                const fr = Math.round(r + (255-r)*fl);
                const fg = Math.round(g + (255-g)*fl);
                const fb = Math.round(b + (255-b)*fl);
                return `rgb(${fr},${fg},${fb})`;
            }

            if (e.kind === 'circle') {
                ctx.fillStyle = flashColor('#c87878');
                ctx.beginPath();
                ctx.arc(ex, ey, e.r * scx, 0, Math.PI * 2);
                ctx.fill();

            } else if (e.kind === 'shooter') {
                ctx.fillStyle = flashColor('#f0a050');
                ctx.strokeStyle = fl > 0.1 ? '#ffffff' : '#ffcc80';
                ctx.lineWidth = 1;
                const s = e.r * scx;
                const h  = [Math.cos(e.angle),       Math.sin(e.angle)];
                const r  = [Math.cos(e.angle + 2.3), Math.sin(e.angle + 2.3)];
                const l  = [Math.cos(e.angle - 2.3), Math.sin(e.angle - 2.3)];
                ctx.beginPath();
                ctx.moveTo(ex + h[0]*s*1.2, ey + h[1]*s*1.2);
                ctx.lineTo(ex + r[0]*s*0.9, ey + r[1]*s*0.9);
                ctx.lineTo(ex + l[0]*s*0.9, ey + l[1]*s*0.9);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

            } else if (e.kind === 'tank') {
                ctx.fillStyle = flashColor('#9b59b6');
                ctx.strokeStyle = fl > 0.1 ? '#ffffff' : '#c39bd3';
                ctx.lineWidth = 1.5;
                const s = e.r * scx;
                ctx.save();
                ctx.translate(ex, ey);
                ctx.rotate(Math.PI / 4);
                ctx.fillRect(-s, -s, s*2, s*2);
                ctx.strokeRect(-s, -s, s*2, s*2);
                ctx.restore();
            }

            // ── Health bar (only when hp < maxHp and maxHp > 1) ──
            if (e.maxHp > 1 && e.hp < e.maxHp) {
                const barW = e.r * 2 * scx;
                const barH = 4 * scx;
                const bx   = ex - barW / 2;
                const by   = ey - e.r * scx - 8 * scx;
                // background
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(bx, by, barW, barH);
                // filled portion — green → red as hp drops
                const frac = e.hp / e.maxHp;
                const hue  = Math.round(frac * 110);   // 110 = green, 0 = red
                ctx.fillStyle = `hsl(${hue},80%,50%)`;
                ctx.fillRect(bx, by, barW * frac, barH);
            }
        }

        // ── Enemy bullets (red-orange, slightly larger than player bullets) ──
        ctx.fillStyle = '#ff6040';
        for (const b of enemyBullets) {
            const [bx, by] = w2s(b.x, b.y);
            if (!onScreen(bx, by, 20)) continue;
            ctx.beginPath();
            ctx.arc(bx, by, 4 * scx, 0, Math.PI * 2);
            ctx.fill();
        }

        // ── Player bullets ──
        ctx.fillStyle = '#fff078';
        for (const b of playerBullets) {
            const [bx, by] = w2s(b.x, b.y);
            ctx.beginPath();
            ctx.arc(bx, by, 3 * scx, 0, Math.PI * 2);
            ctx.fill();
        }

        // ── Remote players (other people in the same game) ──
        for (const id in remotePlayers) {
            const rp = remotePlayers[id];
            if (rp.dead) continue;
            const [rx, ry] = w2s(rp.x, rp.y);
            if (!onScreen(rx, ry)) continue;
            ctx.fillStyle = '#7fdc8f';
            const h = [Math.cos(rp.angle), Math.sin(rp.angle)];
            const r = [Math.cos(rp.angle+2.5), Math.sin(rp.angle+2.5)];
            const l = [Math.cos(rp.angle-2.5), Math.sin(rp.angle-2.5)];
            const s = 12 * scx;
            ctx.beginPath();
            ctx.moveTo(rx + h[0]*s,     ry + h[1]*s);
            ctx.lineTo(rx + r[0]*s*0.7, ry + r[1]*s*0.7);
            ctx.lineTo(rx + l[0]*s*0.7, ry + l[1]*s*0.7);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#9fe0a8';
            ctx.font = '11px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(rp.name || id.slice(0, 6), rx, ry - 18 * scx);
        }

        // ── Remote players' bullets (cosmetic, greenish to distinguish) ──
        ctx.fillStyle = '#90f0a0';
        for (const b of remoteBullets) {
            const [bx, by] = w2s(b.x, b.y);
            if (!onScreen(bx, by, 20)) continue;
            ctx.beginPath();
            ctx.arc(bx, by, 3 * scx, 0, Math.PI * 2);
            ctx.fill();
        }

        // ── Player ship ──
        if (!player.dead) {
            const [px, py] = w2s(player.x, player.y);
            ctx.fillStyle = '#b4c8ff';
            const h = [Math.cos(player.angle), Math.sin(player.angle)];
            const r = [Math.cos(player.angle+2.5), Math.sin(player.angle+2.5)];
            const l = [Math.cos(player.angle-2.5), Math.sin(player.angle-2.5)];
            const s = 12 * scx;
            ctx.beginPath();
            ctx.moveTo(px + h[0]*s,      py + h[1]*s);
            ctx.lineTo(px + r[0]*s*0.7,  py + r[1]*s*0.7);
            ctx.lineTo(px + l[0]*s*0.7,  py + l[1]*s*0.7);
            ctx.closePath();
            ctx.fill();
        }

        // HUD
        document.getElementById('score').textContent = score;
        document.getElementById('deadMsg').style.display = player.dead ? 'block' : 'none';
        // Update host/client role badge next to connection status
        const roleEl = document.getElementById('roleTag');
        if (roleEl && netState === 'connected') {
            roleEl.textContent = isHost ? ' [HOST]' : ' [CLIENT]';
            roleEl.style.color  = isHost ? '#e0c060' : '#80c0ff';
        } else if (roleEl) {
            roleEl.textContent = '';
        }

        drawMinimap();
    }

    function drawMinimap() {
        const mw = mm.width, mh = mm.height;
        const scx = mw / WORLD_W, scy = mh / WORLD_H;

        mctx.fillStyle = 'rgba(10,10,20,0.92)';
        mctx.fillRect(0, 0, mw, mh);

        // Entities — colour-coded by type
        for (const e of entities) {
            const mx = e.x * scx, my = e.y * scy;
            if (e.kind === 'circle') {
                mctx.fillStyle = 'rgba(200,120,120,0.75)';
                mctx.fillRect(mx-1, my-1, 2, 2);
            } else if (e.kind === 'shooter') {
                mctx.fillStyle = '#f0a050';
                mctx.fillRect(mx-1, my-1, 3, 3);
            } else {
                mctx.fillStyle = '#b07fe0';
                mctx.fillRect(mx-2, my-2, 4, 4);
            }
        }

        // Player
        if (!player.dead) {
            mctx.fillStyle = '#b4c8ff';
            mctx.beginPath();
            mctx.arc(player.x * scx, player.y * scy, 3, 0, Math.PI * 2);
            mctx.fill();
        }

        // Remote players
        mctx.fillStyle = '#7fdc8f';
        for (const id in remotePlayers) {
            const rp = remotePlayers[id];
            if (rp.dead) continue;
            mctx.beginPath();
            mctx.arc(rp.x * scx, rp.y * scy, 2.5, 0, Math.PI * 2);
            mctx.fill();
        }

        // Viewport rect
        mctx.strokeStyle = 'rgba(255,255,255,0.65)';
        mctx.lineWidth = 1;
        mctx.strokeRect(
            (player.x - VIEW_W/2) * scx,
            (player.y - VIEW_H/2) * scy,
            VIEW_W * scx, VIEW_H * scy
        );
        mctx.strokeStyle = 'rgba(255,255,255,0.18)';
        mctx.strokeRect(0, 0, mw, mh);
    }

    // ── Loop ──────────────────────────────────────────────────────────────

    let last = Date.now();
    function loop() {
        const now = Date.now(), dt = Math.min((now - last) / 1000, 0.05); last = now;
        update(dt); draw();
        requestAnimationFrame(loop);
    }

    initGame();
    loop();
</script>
</body>
